  <script lang="js">
    function swaptheme() {
      let style = window.getComputedStyle(document.getElementById("body"));
      if (style.getPropertyValue("--background") == "#282A36") {
        // in dark mode
        console.log("switching to light");
        
        document.documentElement.style.setProperty("--background", "#FFFBEB")
        document.documentElement.style.setProperty("--foreground", "#1F1F1F")
        document.documentElement.style.setProperty("--accent", "#A34D14")
      }
      else {
        // in light mode
        console.log("switching to dark");

        document.documentElement.style.setProperty("--background", "#282A36")
        document.documentElement.style.setProperty("--foreground", "#F8F8F2")
        document.documentElement.style.setProperty("--accent", "#FFB86C")
      }
    }
  </script>
